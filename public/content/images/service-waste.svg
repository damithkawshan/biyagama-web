<?xml version="1.0" encoding="UTF-8"?>
<svg width="250" height="150" viewBox="0 0 250 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Waste Management Icon -->
  <defs>
    <linearGradient id="wasteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#228B22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#32CD32;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="250" height="150" fill="#e6f2ff" rx="8"/>
  
  <!-- Waste bins -->
  <rect x="50" y="60" width="40" height="50" fill="url(#wasteGrad)" rx="4"/>
  <rect x="50" y="55" width="40" height="8" fill="#228B22" rx="2"/>
  <circle cx="70" cy="85" r="3" fill="#ffffff"/>
  
  <rect x="105" y="60" width="40" height="50" fill="#007bff" rx="4"/>
  <rect x="105" y="55" width="40" height="8" fill="#0056b3" rx="2"/>
  <circle cx="125" cy="85" r="3" fill="#ffffff"/>
  
  <rect x="160" y="60" width="40" height="50" fill="#dc3545" rx="4"/>
  <rect x="160" y="55" width="40" height="8" fill="#c82333" rx="2"/>
  <circle cx="180" cy="85" r="3" fill="#ffffff"/>
  
  <!-- Recycling symbol -->
  <g transform="translate(125, 25)">
    <path d="M0,-10 L5,0 L-5,0 Z" fill="#228B22"/>
    <path d="M8.66,-5 L5,5 L13.66,0 Z" fill="#228B22" transform="rotate(120 0 0)"/>
    <path d="M8.66,-5 L5,5 L13.66,0 Z" fill="#228B22" transform="rotate(240 0 0)"/>
    <circle r="4" fill="none" stroke="#228B22" stroke-width="1.5"/>
  </g>
  
  <text x="125" y="135" font-family="Arial" font-size="14" fill="#004080" text-anchor="middle" font-weight="bold">
    Waste Management
  </text>
</svg>
