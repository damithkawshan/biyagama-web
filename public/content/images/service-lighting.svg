<?xml version="1.0" encoding="UTF-8"?>
<svg width="250" height="150" viewBox="0 0 250 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Street Lighting Icon -->
  <rect width="250" height="150" fill="#1a1a2e" rx="8"/>
  
  <!-- Stars in night sky -->
  <circle cx="50" cy="30" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="80" cy="25" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="170" cy="35" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="200" cy="28" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="220" cy="40" r="1" fill="#ffffff" opacity="0.5"/>
  
  <!-- Street lamp post -->
  <rect x="118" y="60" width="4" height="70" fill="#4a4a4a"/>
  <rect x="115" y="130" width="10" height="5" fill="#333333"/>
  
  <!-- Lamp head -->
  <path d="M105,60 L120,45 L140,60 Z" fill="#2c3e50"/>
  
  <!-- Light bulb and glow -->
  <circle cx="120" cy="55" r="8" fill="#FFD700"/>
  <circle cx="120" cy="55" r="15" fill="#FFD700" opacity="0.3"/>
  <circle cx="120" cy="55" r="25" fill="#FFF8DC" opacity="0.2"/>
  <circle cx="120" cy="55" r="35" fill="#FFFACD" opacity="0.1"/>
  
  <!-- Light beam -->
  <path d="M110,60 L70,130 L170,130 L130,60 Z" fill="#FFD700" opacity="0.2"/>
  
  <!-- Ground -->
  <rect x="0" y="130" width="250" height="20" fill="#2c3e50"/>
  
  <!-- Road marking -->
  <rect x="115" y="135" width="10" height="3" fill="#ffffff"/>
  
  <text x="125" y="25" font-family="Arial" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">
    Street Lighting
  </text>
</svg>
