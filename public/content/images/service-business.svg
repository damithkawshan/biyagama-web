<?xml version="1.0" encoding="UTF-8"?>
<svg width="250" height="150" viewBox="0 0 250 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Business License Icon -->
  <rect width="250" height="150" fill="#e6f2ff" rx="8"/>
  
  <!-- Store front -->
  <rect x="70" y="50" width="110" height="70" fill="#ffffff" stroke="#004080" stroke-width="2" rx="4"/>
  
  <!-- Awning -->
  <path d="M65,50 L70,45 L180,45 L185,50 Z" fill="#FF6B6B" stroke="#c82333" stroke-width="1"/>
  <line x1="75" y1="45" x2="75" y2="50" stroke="#c82333" stroke-width="1"/>
  <line x1="95" y1="45" x2="95" y2="50" stroke="#c82333" stroke-width="1"/>
  <line x1="115" y1="45" x2="115" y2="50" stroke="#c82333" stroke-width="1"/>
  <line x1="135" y1="45" x2="135" y2="50" stroke="#c82333" stroke-width="1"/>
  <line x1="155" y1="45" x2="155" y2="50" stroke="#c82333" stroke-width="1"/>
  <line x1="175" y1="45" x2="175" y2="50" stroke="#c82333" stroke-width="1"/>
  
  <!-- Windows -->
  <rect x="80" y="60" width="40" height="30" fill="#87CEEB" stroke="#004080" stroke-width="1.5"/>
  <line x1="100" y1="60" x2="100" y2="90" stroke="#004080" stroke-width="1.5"/>
  <line x1="80" y1="75" x2="120" y2="75" stroke="#004080" stroke-width="1.5"/>
  
  <rect x="130" y="60" width="40" height="30" fill="#87CEEB" stroke="#004080" stroke-width="1.5"/>
  <line x1="150" y1="60" x2="150" y2="90" stroke="#004080" stroke-width="1.5"/>
  <line x1="130" y1="75" x2="170" y2="75" stroke="#004080" stroke-width="1.5"/>
  
  <!-- Door -->
  <rect x="105" y="95" width="40" height="25" fill="#8B4513" rx="2"/>
  <circle cx="137" cy="107" r="2" fill="#FFD700"/>
  
  <!-- Open sign -->
  <ellipse cx="125" cy="70" rx="15" ry="10" fill="#FFD700" stroke="#FFA500" stroke-width="1.5"/>
  <text x="125" y="73" font-family="Arial" font-size="8" fill="#004080" text-anchor="middle" font-weight="bold">
    OPEN
  </text>
  
  <text x="125" y="140" font-family="Arial" font-size="14" fill="#004080" text-anchor="middle" font-weight="bold">
    Business Licenses
  </text>
</svg>
