<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Background -->
  <defs>
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#004080;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0059b3;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#e6f2ff;stop-opacity:0.6" />
    </linearGradient>
    
    <pattern id="gridPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>
  
  <!-- Base gradient -->
  <rect width="1200" height="400" fill="url(#heroGradient)"/>
  
  <!-- Grid overlay -->
  <rect width="1200" height="400" fill="url(#gridPattern)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="80" fill="#ffffff" opacity="0.05"/>
  <circle cx="1100" cy="300" r="120" fill="#ffffff" opacity="0.05"/>
  <circle cx="600" cy="50" r="60" fill="#ffffff" opacity="0.08"/>
  
  <!-- Geometric shapes -->
  <polygon points="0,400 200,400 100,300" fill="#0059b3" opacity="0.1"/>
  <polygon points="1200,0 1000,0 1100,100" fill="#004080" opacity="0.1"/>
  
  <!-- Wave pattern at bottom -->
  <path d="M0,350 Q300,320 600,350 T1200,350 L1200,400 L0,400 Z" fill="#004080" opacity="0.15"/>
  <path d="M0,370 Q300,340 600,370 T1200,370 L1200,400 L0,400 Z" fill="#004080" opacity="0.1"/>
</svg>
